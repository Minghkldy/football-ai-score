<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Football Live Score & Prediction</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d0e12; color: #ffffff; }
        .card { background-color: #181a20; border-radius: 12px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-3xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6 border-b border-gray-800 pb-4">
            <h1 class="text-2xl font-bold text-green-500">⚽ AI Score & Predictions</h1>
            <!-- Date Selector (FotMob Style) -->
            <div>
                <input type="date" id="match-date" class="bg-gray-800 text-white px-3 py-1.5 rounded-lg border border-gray-700 text-sm focus:outline-none focus:border-green-500">
            </div>
        </div>

        <!-- Matches Container -->
        <div id="matches-list" class="space-y-4">
            <p class="text-gray-400 text-center">ပွဲစဉ်အချက်အလက်များကို ရယူနေပါသည်...</p>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://football-ai-score.onrender.com/api/matches";
        let allMatches = [];

        const today = new Date().toISOString().split('T')[0];
        const dateInput = document.getElementById('match-date');
        dateInput.value = today;

        dateInput.addEventListener('change', (e) => {
            renderMatches(e.target.value);
        });

        async function fetchAllMatches() {
            const container = document.getElementById('matches-list');
            try {
                const response = await fetch(BACKEND_URL);
                allMatches = await response.json();

                if (!Array.isArray(allMatches)) {
                    container.innerHTML = `<p class="text-red-400 text-center">ဒေတာရယူရာတွင် အမှားအယွင်း ရှိပါသည်</p>`;
                    return;
                }

                renderMatches(dateInput.value);
            } catch (error) {
                container.innerHTML = `<p class="text-red-400 text-center">ဆာဗာသို့ ချိတ်ဆက်၍ မရပါ။</p>`;
            }
        }

        function renderMatches(selectedDate) {
            const container = document.getElementById('matches-list');
            container.innerHTML = '';

            const filteredMatches = allMatches.filter(match => {
                if (!match.utcDate) return false;
                return match.utcDate.startsWith(selectedDate);
            });

            if (filteredMatches.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center">ရွေးချယ်ထားသောရက် (${selectedDate}) တွင် ပွဲစဉ်မရှိပါ</p>`;
                return;
            }

            filteredMatches.forEach(match => {
                const matchTime = new Date(match.utcDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                const html = `
                    <div class="card p-4 shadow-lg border border-gray-800">
                        <!-- လိဂ်အမည်ခေါင်းစဉ် -->
                        <div class="flex justify-between items-center mb-2 border-b border-gray-800 pb-1">
                            <span class="text-xs font-semibold text-green-400 uppercase tracking-wider">🏆 ${match.competition || 'League'}</span>
                            <span class="text-xs text-gray-400">${matchTime} (${match.status})</span>
                        </div>
                        
                        <div class="flex justify-between items-center text-lg font-semibold mb-3">
                            <span class="w-2/5 text-right">${match.homeTeam}</span>
                            <span class="text-xs bg-gray-700 px-2 py-1 rounded text-gray-300">VS</span>
                            <span class="w-2/5 text-left">${match.awayTeam}</span>
                        </div>
                        <div class="bg-gray-900/50 p-3 rounded-lg border border-gray-800 text-sm">
                            <div class="flex justify-between items-center text-green-400 font-medium mb-1">
                                <span>🤖 AI Prediction: ${match.prediction.predicted_score}</span>
                                <span class="text-xs text-gray-400">Home Win: ${match.prediction.home_win_chance}</span>
                            </div>
                            <p class="text-gray-300 text-xs italic">${match.prediction.ai_advice}</p>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        fetchAllMatches();
    </script>
</body>
</html>
