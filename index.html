<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Football Live Score & Prediction</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d0e12; color: #ffffff; }
        .card { background-color: #181a20; border-radius: 12px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-3xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6 border-b border-gray-800 pb-4">
            <h1 class="text-2xl font-bold text-green-500">⚽ AI Score & Predictions</h1>
            <span class="text-sm bg-gray-800 px-3 py-1 rounded-full text-gray-400">Live API</span>
        </div>

        <!-- Matches Container -->
        <div id="matches-list" class="space-y-4">
            <p class="text-gray-400 text-center">ပွဲစဉ်အချက်အလက်များ ရယူနေပါသည်...</p>
        </div>
    </div>

    <script>
        // Backend Server URL (Local သို့မဟုတ် Vercel/Render URL)
        const BACKEND_URL = "http://127.0.0.1:5000/api/matches";

        async function fetchMatches() {
            try {
                const response = await fetch(BACKEND_URL);
                const matches = await response.json();
                
                const container = document.getElementById('matches-list');
                container.innerHTML = '';

                matches.forEach(match => {
                    const html = `
                        <div class="card p-4 shadow-lg border border-gray-800">
                            <!-- Match Teams -->
                            <div class="flex justify-between items-center text-lg font-semibold mb-3">
                                <span class="w-2/5 text-right">${match.homeTeam}</span>
                                <span class="text-xs bg-gray-700 px-2 py-1 rounded text-gray-300">VS</span>
                                <span class="w-2/5 text-left">${match.awayTeam}</span>
                            </div>

                            <!-- AI Prediction Box -->
                            <div class="bg-gray-900 p-3 rounded-lg border border-gray-800 mt-2 text-xs text-gray-300">
                                <div class="flex justify-between font-medium text-green-400 mb-1">
                                    <span>🤖 AI Prediction: ${match.prediction.predicted_score}</span>
                                    <span>Home Win: ${match.prediction.home_win_chance}</span>
                                </div>
                                <p class="text-gray-400 italic">${match.prediction.ai_advice}</p>
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });
            } catch (error) {
                console.error("Error loading matches:", error);
            }
        }

        fetchMatches();
    </script>
</body>
</html>
